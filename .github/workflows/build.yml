name: Build Flipper app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build for ${{ matrix.firmware }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: official
            sdk-index-url: https://update.flipperzero.one/firmware/directory.json
          - firmware: unleashed
            sdk-index-url: https://up.unleashedflip.com/directory.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build app
        env:
          SDK_INDEX_URL: ${{ matrix.sdk-index-url }}
        run: |
          python -m pip install --require-hashes -r .github/requirements-build.txt
          ufbt update --index-url="$SDK_INDEX_URL" --channel=release
          ufbt -s
      - name: Name binary
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          mkdir -p release
          cp dist/gattacker.fap "release/ESP32-GATTacker-${FIRMWARE}.fap"
          test -s "release/ESP32-GATTacker-${FIRMWARE}.fap"
      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ESP32-GATTacker-${{ matrix.firmware }}
          path: release/ESP32-GATTacker-${{ matrix.firmware }}.fap
          if-no-files-found: error

  test:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "  fap_version=(${version//./, })," application.fam
      - name: Install Wireshark CLI
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Run host tests
        run: |
          python3 -m unittest discover -s tests -v
          cc -std=c17 -Iapp/core \
            tests/core_test.c app/core/wire.c app/core/rules.c \
            -o /tmp/gattacker-core
          /tmp/gattacker-core

  release:
    name: Publish binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to create the GitHub Release and upload binaries.
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ESP32-GATTacker-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release/ESP32-GATTacker-official.fap
          test -s release/ESP32-GATTacker-unleashed.fap
          gh release create "$GITHUB_REF_NAME" \
            release/ESP32-GATTacker-official.fap \
            release/ESP32-GATTacker-unleashed.fap \
            --verify-tag --generate-notes --latest
